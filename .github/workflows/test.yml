name: Tests y Validación

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 10 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check syntax
        run: python -m py_compile 2Grey.py
      
      - name: Test basic import
        run: python -c "from PIL import Image; print('PIL import successful')"
      
      - name: Test script execution with help
        run: python 2Grey.py --help
      
      - name: Create test image
        run: |
          python -c "
          from PIL import Image
          # Create a small test image
          img = Image.new('RGB', (10, 10), color='red')
          img.save('test_image.png')
          print('Test image created')
          "
      
      - name: Test grey conversion
        run: python 2Grey.py test_image.png -o test_image_grey.png
      
      - name: Verify output
        run: |
          python -c "
          from PIL import Image
          img = Image.open('test_image_grey.png')
          if img.mode == 'L':
            print('✓ Output image is correctly in grayscale (L mode)')
          else:
            print('✗ Output image mode is not L:', img.mode)
            exit(1)
          "
      
      - name: Clean up
        run: rm -f test_image.png test_image_grey.png
