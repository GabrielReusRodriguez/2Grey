name: Security Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 8 * * 1'

jobs:
  security:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      
      - name: Check for known vulnerabilities in dependencies
        run: |
          echo "Checking Python dependencies..."
          safety check --file requirements.txt || echo "Safety check completed with warnings"
      
      - name: Scan code for security issues
        run: |
          echo "Running bandit security scan..."
          bandit -r . -ll -f json -o bandit-report.json || echo "Bandit scan completed"
          bandit -r . -ll
      
      - name: Check for insecure patterns
        run: |
          python -c "
          import re
          
          insecure_patterns = [
              (r'eval\s*\(', 'eval() usage'),
              (r'exec\s*\(', 'exec() usage'),
              (r'__import__', '__import__ usage'),
              (r'pickle\.loads', 'pickle.loads usage'),
          ]
          
          found_issues = False
          
          with open('2Grey.py', 'r') as f:
              content = f.read()
              for pattern, name in insecure_patterns:
                  if re.search(pattern, content):
                      print(f'⚠️  Found {name} in 2Grey.py')
                      found_issues = True
          
          if not found_issues:
              print('✓ No insecure patterns found')
          "
      
      - name: Validate input handling
        run: |
          python -c "
          import ast
          
          with open('2Grey.py', 'r') as f:
              tree = ast.parse(f.read())
          
          # Check if validate_input function exists
          functions = [node.name for node in ast.walk(tree) if isinstance(node, ast.FunctionDef)]
          
          if 'validate_input' in functions:
              print('✓ Input validation function found')
          else:
              print('⚠️  Input validation might be missing')
          "
      
      - name: Check .gitignore
        run: |
          if [ -f .gitignore ]; then
            echo "✓ .gitignore exists"
            echo "Content:"
            cat .gitignore
          else
            echo "⚠️  .gitignore file not found"
          fi
      
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: bandit-report.json
          retention-days: 30
